<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lullaby</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body>
    <h1>Lullaby</h1>
    <!-- Filter Buttons (Piano is active by default) -->
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="piano">Piano Sheets</button>
        <button class="filter-btn" data-filter="written">Written Sheets</button>
        <button class="filter-btn" data-filter="guitar">Guitar Sheets</button>
    </div>
    <!-- Sheets Grid -->
    <div class="sheets-grid">
        <!-- Written Sheet  -->
        <div class="sheet-card sheet hide" data-category="written">
            <div class="card-icon">📄
                <h2>Written Sheet</h2>
            </div>
            <p>This isn't available now.</p>
        </div>
        <!-- Piano Sheet -->
        <div class="sheet-card"  data-category="piano">
            <div class="card-icon">🎹
                <h2>Piano Sheet</h2>
            </div>
            <p>This isn't available now.</p>
        </div>
        <!-- Guitar Sheet -->
        <div class="sheet-card hide" data-category="guitar">
            <div class="card-icon">🎸
                <h2>Guitar Sheet</h2>
            </div>
            <div class="pdf-viewer" data-pdf="../Sheets_Data/Lullaby_(guitar).pdf"></div>
        </div>
    </div>
    <div class="music-notes-container">
        <span class="note note-1">♪</span>
        <span class="note note-2">♫</span>
        <span class="note note-3">♩</span>
        <span class="note note-4">♬</span>
        <span class="note note-5">♭</span>
    </div>
</body>
</html>
