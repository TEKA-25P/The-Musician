<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Story</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js" defer></script>
</head>
<body>
    <h1>Love Story</h1>
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="piano">Piano Sheets</button>
        <button class="filter-btn" data-filter="written">Written Sheets</button>
        <button class="filter-btn" data-filter="guitar">Guitar Sheets</button>
    </div>
    <div class="sheets-grid">
        <div class="sheet-card sheet hide" data-category="written">
            <div class="card-icon">📄
                <h2>Written Sheet</h2>
            </div>
            <p>This isn't available now.</p>
        </div>
        <div class="sheet-card" data-category="piano">
            <div class="card-icon">🎹
                <h2>Piano Sheet</h2>
            </div>
            <div class="pdf-viewer" data-pdf="../Sheets_Data/Love_Story_(piano)_dark.pdf"></div>
        </div>
        <div class="sheet-card hide" data-category="guitar">
            <div class="card-icon">🎸
                <h2>Guitar Sheet</h2>
            </div>
            <p>This isn't available now.</p>
        </div>
    </div>
</body>
</html>
